<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
      <title>マイ・ネットナビ</title>
        <style>
            * { box-sizing: border-box; }
                body {
                      font-family: 'Helvetica Neue', Arial, sans-serif;
                            background-color: #0d1117;
                                  color: #00fff5;
                                        display: flex;
                                              flex-direction: column;
                                                    align-items: center;
                                                          justify-content: center;
                                                                min-height: 100vh;
                                                                      margin: 0;
                                                                            padding: 20px;
                                                                                }
                                                                                    .navi-container {
                                                                                          background: rgba(22, 33, 62, 0.9);
                                                                                                border: 2px solid #00fff5;
                                                                                                      border-radius: 20px;
                                                                                                            padding: 20px;
                                                                                                                  width: 100%;
                                                                                                                        max-width: 400px;
                                                                                                                              box-shadow: 0 0 20px rgba(0, 255, 245, 0.4);
                                                                                                                                    text-align: center;
                                                                                                                                        }
                                                                                                                                            .navi-avatar {
                                                                                                                                                  font-size: 70px;
                                                                                                                                                        margin: 10px 0;
                                                                                                                                                              filter: drop-shadow(0 0 10px #00fff5);
                                                                                                                                                                  }
                                                                                                                                                                      .status-bar {
                                                                                                                                                                            font-size: 14px;
                                                                                                                                                                                  background: #0f3460;
                                                                                                                                                                                        padding: 5px 10px;
                                                                                                                                                                                              border-radius: 10px;
                                                                                                                                                                                                    margin-bottom: 15px;
                                                                                                                                                                                                          color: #ffdd59;
                                                                                                                                                                                                              }
                                                                                                                                                                                                                  .speech-bubble {
                                                                                                                                                                                                                        background-color: #162447;
                                                                                                                                                                                                                              border-left: 4px solid #00fff5;
                                                                                                                                                                                                                                    border-radius: 8px;
                                                                                                                                                                                                                                          padding: 12px;
                                                                                                                                                                                                                                                margin-bottom: 20px;
                                                                                                                                                                                                                                                      text-align: left;
                                                                                                                                                                                                                                                            font-size: 15px;
                                                                                                                                                                                                                                                                  color: #ffffff;
                                                                                                                                                                                                                                                                        min-height: 60px;
                                                                                                                                                                                                                                                                              line-height: 1.5;
                                                                                                                                                                                                                                                                                  }
                                                                                                                                                                                                                                                                                      .input-group {
                                                                                                                                                                                                                                                                                            display: flex;
                                                                                                                                                                                                                                                                                                  gap: 10px;
                                                                                                                                                                                                                                                                                                      }
                                                                                                                                                                                                                                                                                                          input[type="text"] {
                                                                                                                                                                                                                                                                                                                flex: 1;
                                                                                                                                                                                                                                                                                                                      padding: 12px;
                                                                                                                                                                                                                                                                                                                            border-radius: 8px;
                                                                                                                                                                                                                                                                                                                                  border: 1px solid #00fff5;
                                                                                                                                                                                                                                                                                                                                        background: #0f3460;
                                                                                                                                                                                                                                                                                                                                              color: #fff;
                                                                                                                                                                                                                                                                                                                                                    font-size: 16px;
                                                                                                                                                                                                                                                                                                                                                          outline: none;
                                                                                                                                                                                                                                                                                                                                                              }
                                                                                                                                                                                                                                                                                                                                                                  button {
                                                                                                                                                                                                                                                                                                                                                                        padding: 12px 18px;
                                                                                                                                                                                                                                                                                                                                                                              background-color: #00fff5;
                                                                                                                                                                                                                                                                                                                                                                                    color: #000;
                                                                                                                                                                                                                                                                                                                                                                                          border: none;
                                                                                                                                                                                                                                                                                                                                                                                                border-radius: 8px;
                                                                                                                                                                                                                                                                                                                                                                                                      font-weight: bold;
                                                                                                                                                                                                                                                                                                                                                                                                            font-size: 15px;
                                                                                                                                                                                                                                                                                                                                                                                                                  cursor: pointer;
                                                                                                                                                                                                                                                                                                                                                                                                                      }
                                                                                                                                                                                                                                                                                                                                                                                                                        </style>
                                                                                                                                                                                                                                                                                                                                                                                                                        </head>
                                                                                                                                                                                                                                                                                                                                                                                                                        <body>

                                                                                                                                                                                                                                                                                                                                                                                                                          <div class="navi-container">
                                                                                                                                                                                                                                                                                                                                                                                                                              <div class="status-bar">
                                                                                                                                                                                                                                                                                                                                                                                                                                    所持金: <span id="zeny">100</span> Zeny | Status: ONLINE
                                                                                                                                                                                                                                                                                                                                                                                                                                        </div>

                                                                                                                                                                                                                                                                                                                                                                                                                                            <!-- ナビの見た目（アバターアイコン） -->
                                                                                                                                                                                                                                                                                                                                                                                                                                                <div class="navi-avatar">🤖</div>

                                                                                                                                                                                                                                                                                                                                                                                                                                                    <!-- ナビのセリフ表示エリア -->
                                                                                                                                                                                                                                                                                                                                                                                                                                                        <div class="speech-bubble" id="navi-text">
                                                                                                                                                                                                                                                                                                                                                                                                                                                              プラグイン完了！オペレーター、いつでも指示をくれ！
                                                                                                                                                                                                                                                                                                                                                                                                                                                                  </div>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                      <!-- 入力フォーム -->
                                                                                                                                                                                                                                                                                                                                                                                                                                                                          <div class="input-group">
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                <input type="text" id="user-input" placeholder="ナビに話しかける...">
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      <button onclick="sendMessage()">送信</button>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          </div>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            </div>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              <script>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  let zeny = 100;

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      function sendMessage() {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            const input = document.getElementById('user-input');
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  const naviText = document.getElementById('navi-text');
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        const zenyText = document.getElementById('zeny');
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              const text = input.value.trim();

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    if (text === "") return;

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          let response = "";

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                if (text.includes("時間") || text.includes("時")) {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        const now = new Date();
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                response = `現在の時間は ${now.getHours()}時${now.getMinutes()}分 だよ、オペレーター！`;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      } else if (text.includes("タスク") || text.includes("お手伝い") || text.includes("完了")) {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              zeny += 50;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      zenyText.innerText = zeny;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              response = `タスク完了だね！お疲れ様！報酬として 50 Zeny 獲得したよ！（現在の所持金: ${zeny} Zeny）`;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    } else {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            response = `「${text}」だね！了解したよ、オペレーター！`;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  }

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        // 画面のテキストを更新
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              naviText.innerText = response;

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    // スマホの音声で喋らせる（音声合成）
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          if ('speechSynthesis' in window) {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  window.speechSynthesis.cancel();
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          const uttr = new SpeechSynthesisUtterance(response);
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  uttr.lang = 'ja-JP';
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          uttr.pitch = 1.2; // 少し高めの声
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  window.speechSynthesis.speak(uttr);
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        }

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              input.value = "";
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  }
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    </script>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    </body>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    </html>
