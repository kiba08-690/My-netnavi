<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PET Terminal - Partner AI System</title>
<style>
  :root {
      --bg-color: #0a0d14;
          --main-color: #00f0ff;
              --accent-color: #ff0055;
                  --card-bg: #121824;
                      --text-color: #e6edf3;
                        }
                          body {
                              background-color: var(--bg-color);
                                  color: var(--text-color);
                                      font-family: 'Courier New', monospace;
                                          margin: 0;
                                              padding: 10px;
                                                  display: flex;
                                                      justify-content: center;
                                                        }
                                                          .pet-terminal {
                                                              width: 100%;
                                                                  max-width: 440px;
                                                                      border: 2px solid var(--main-color);
                                                                          border-radius: 12px;
                                                                              padding: 12px;
                                                                                  background: radial-gradient(circle, #162235 0%, #0a0d14 100%);
                                                                                      box-shadow: 0 0 20px rgba(0, 240, 255, 0.25);
                                                                                        }
                                                                                          .header-bar {
                                                                                              display: flex;
                                                                                                  justify-content: space-between;
                                                                                                      border-bottom: 1px solid var(--main-color);
                                                                                                          padding-bottom: 6px;
                                                                                                              font-size: 0.8em;
                                                                                                                }
                                                                                                                  /* 自室（ナビの部屋） */
                                                                                                                    .room-display {
                                                                                                                        height: 180px;
                                                                                                                            margin: 10px 0;
                                                                                                                                border: 1px dashed rgba(0, 240, 255, 0.3);
                                                                                                                                    position: relative;
                                                                                                                                        display: flex;
                                                                                                                                            flex-direction: column;
                                                                                                                                                align-items: center;
                                                                                                                                                    justify-content: center;
                                                                                                                                                        overflow: hidden;
                                                                                                                                                          }
                                                                                                                                                            .navi-avatar-area {
                                                                                                                                                                width: 80px;
                                                                                                                                                                    height: 80px;
                                                                                                                                                                        background: var(--main-color);
                                                                                                                                                                            clip-path: polygon(50% 0%, 100% 25%, 100% 75%, 50% 100%, 0% 75%, 0% 25%);
                                                                                                                                                                                animation: float 3s ease-in-out infinite;
                                                                                                                                                                                    transition: transform 0.3s, filter 0.3s;
                                                                                                                                                                                      }
                                                                                                                                                                                        /* 見た目変形モードのCSS再現 */
                                                                                                                                                                                          .mode-deform { transform: scaleY(0.7) scaleX(1.2) !important; }
                                                                                                                                                                                            .mode-pixel { filter: contrast(200%) pixelate(4px); clip-path: none; }

                                                                                                                                                                                              @keyframes float {
                                                                                                                                                                                                  0%, 100% { transform: translateY(0px); }
                                                                                                                                                                                                      50% { transform: translateY(-6px); }
                                                                                                                                                                                                        }
                                                                                                                                                                                                          .dialogue-box {
                                                                                                                                                                                                              background: rgba(0, 0, 0, 0.7);
                                                                                                                                                                                                                  border: 1px solid var(--main-color);
                                                                                                                                                                                                                      padding: 6px 10px;
                                                                                                                                                                                                                          border-radius: 6px;
                                                                                                                                                                                                                              margin-top: 8px;
                                                                                                                                                                                                                                  font-size: 0.8em;
                                                                                                                                                                                                                                      width: 85%;
                                                                                                                                                                                                                                          text-align: center;
                                                                                                                                                                                                                                            }
                                                                                                                                                                                                                                              .console-log {
                                                                                                                                                                                                                                                  background: var(--card-bg);
                                                                                                                                                                                                                                                      padding: 8px;
                                                                                                                                                                                                                                                          border-radius: 6px;
                                                                                                                                                                                                                                                              height: 100px;
                                                                                                                                                                                                                                                                  overflow-y: auto;
                                                                                                                                                                                                                                                                      font-size: 0.75em;
                                                                                                                                                                                                                                                                          margin-bottom: 8px;
                                                                                                                                                                                                                                                                            }
                                                                                                                                                                                                                                                                              .input-area {
                                                                                                                                                                                                                                                                                  display: flex;
                                                                                                                                                                                                                                                                                      gap: 6px;
                                                                                                                                                                                                                                                                                        }
                                                                                                                                                                                                                                                                                          input[type="text"] {
                                                                                                                                                                                                                                                                                              flex: 1;
                                                                                                                                                                                                                                                                                                  background: #000;
                                                                                                                                                                                                                                                                                                      border: 1px solid var(--main-color);
                                                                                                                                                                                                                                                                                                          color: #fff;
                                                                                                                                                                                                                                                                                                              padding: 8px;
                                                                                                                                                                                                                                                                                                                  border-radius: 4px;
                                                                                                                                                                                                                                                                                                                      font-size: 0.8em;
                                                                                                                                                                                                                                                                                                                        }
                                                                                                                                                                                                                                                                                                                          button {
                                                                                                                                                                                                                                                                                                                              background: var(--main-color);
                                                                                                                                                                                                                                                                                                                                  color: #000;
                                                                                                                                                                                                                                                                                                                                      border: none;
                                                                                                                                                                                                                                                                                                                                          padding: 8px 12px;
                                                                                                                                                                                                                                                                                                                                              font-weight: bold;
                                                                                                                                                                                                                                                                                                                                                  border-radius: 4px;
                                                                                                                                                                                                                                                                                                                                                      cursor: pointer;
                                                                                                                                                                                                                                                                                                                                                        }
                                                                                                                                                                                                                                                                                                                                                          .menu-grid {
                                                                                                                                                                                                                                                                                                                                                              display: grid;
                                                                                                                                                                                                                                                                                                                                                                  grid-template-columns: repeat(3, 1fr);
                                                                                                                                                                                                                                                                                                                                                                      gap: 6px;
                                                                                                                                                                                                                                                                                                                                                                          margin-top: 10px;
                                                                                                                                                                                                                                                                                                                                                                            }
                                                                                                                                                                                                                                                                                                                                                                              .menu-btn {
                                                                                                                                                                                                                                                                                                                                                                                  background: var(--card-bg);
                                                                                                                                                                                                                                                                                                                                                                                      border: 1px solid rgba(0, 240, 255, 0.4);
                                                                                                                                                                                                                                                                                                                                                                                          color: var(--text-color);
                                                                                                                                                                                                                                                                                                                                                                                              padding: 6px;
                                                                                                                                                                                                                                                                                                                                                                                                  font-size: 0.7em;
                                                                                                                                                                                                                                                                                                                                                                                                      border-radius: 4px;
                                                                                                                                                                                                                                                                                                                                                                                                          text-align: center;
                                                                                                                                                                                                                                                                                                                                                                                                              cursor: pointer;
                                                                                                                                                                                                                                                                                                                                                                                                                }
                                                                                                                                                                                                                                                                                                                                                                                                                  .style-tag {
                                                                                                                                                                                                                                                                                                                                                                                                                      color: var(--accent-color);
                                                                                                                                                                                                                                                                                                                                                                                                                          font-weight: bold;
                                                                                                                                                                                                                                                                                                                                                                                                                            }
                                                                                                                                                                                                                                                                                                                                                                                                                            </style>
                                                                                                                                                                                                                                                                                                                                                                                                                            </head>
                                                                                                                                                                                                                                                                                                                                                                                                                            <body>

                                                                                                                                                                                                                                                                                                                                                                                                                            <div class="pet-terminal">
                                                                                                                                                                                                                                                                                                                                                                                                                              <div class="header-bar">
                                                                                                                                                                                                                                                                                                                                                                                                                                  <span>PET OS: v1.0</span>
                                                                                                                                                                                                                                                                                                                                                                                                                                      <span id="clock">00:00</span>
                                                                                                                                                                                                                                                                                                                                                                                                                                        </div>

                                                                                                                                                                                                                                                                                                                                                                                                                                          <!-- 自室ディスプレイ -->
                                                                                                                                                                                                                                                                                                                                                                                                                                            <div class="room-display">
                                                                                                                                                                                                                                                                                                                                                                                                                                                <div class="navi-avatar-area" id="navi-avatar"></div>
                                                                                                                                                                                                                                                                                                                                                                                                                                                    <div class="dialogue-box" id="navi-speech">
                                                                                                                                                                                                                                                                                                                                                                                                                                                          「オペレーター、今日もよろしく！何から進める？」
                                                                                                                                                                                                                                                                                                                                                                                                                                                              </div>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                </div>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                  <!-- ログ出力 -->
                                                                                                                                                                                                                                                                                                                                                                                                                                                                    <div class="console-log" id="sys-log">
                                                                                                                                                                                                                                                                                                                                                                                                                                                                        <div>[System] パートナーAIターミナル起動。</div>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                            <div>[System] 現在のスタイル: <span class="style-tag" id="current-style-display">ノーマル (無)</span></div>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                              </div>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                <!-- 入力バー -->
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  <div class="input-area">
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      <input type="text" id="cmd-input" placeholder="例: 明日18時飲み会 / 25日17〜22時時給1200円バイト / ランチ1000円">
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          <button onclick="processInput()">送信</button>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            </div>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              <!-- ツールメニュー -->
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                <div class="menu-grid">
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    <div class="menu-btn" onclick="toggleViewMode()">見た目切替</div>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        <div class="menu-btn" onclick="checkStyleProgress()">スタイル解析</div>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            <div class="menu-btn" onclick="switchStyle('normal')">ノーマル化</div>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                <div class="menu-btn" onclick="showStats()">データ確認</div>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    <div class="menu-btn" onclick="triggerTimer()">ポモドーロ</div>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        <div class="menu-btn" onclick="resetLog()">クリア</div>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          </div>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          </div>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          <script>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            // 隠しステータス（ユーザー非公開データ）
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              let hiddenStats = {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  talkCount: 0,
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      taskCount: 0,
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          shiftEarned: 0,
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              expenseCount: 0,
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  timerFocusMin: 0
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    };

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      // 習得済みスタイルリスト
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        let unlockedStyles = [
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            { name: "ノーマル", element: "無", distance: "中衛", weapon: "なし", job: "バランス" }
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              ];
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                let activeStyleIndex = 0;

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  let viewModes = ["等身大 (Live2D)", "デフォルメ", "ドット風"];
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    let currentViewIndex = 0;

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      function updateClock() {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          const now = new Date();
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              document.getElementById('clock').innerText = now.toTimeString().substring(0, 5);
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                }
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  setInterval(updateClock, 1000);
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    updateClock();

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      function sysLog(msg) {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          const logBox = document.getElementById('sys-log');
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              logBox.innerHTML += `<div>${msg}</div>`;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  logBox.scrollTop = logBox.scrollHeight;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    }

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      function naviSay(msg) {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          document.getElementById('navi-speech').innerText = msg;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            }

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              // 入力解析処理（一括判別）
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                function processInput() {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    const input = document.getElementById('cmd-input').value.trim();
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        if (!input) return;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            document.getElementById('cmd-input').value = '';

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                sysLog(`[User] ${input}`);
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    hiddenStats.talkCount += 1;

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        // 1. シフト・給与判別
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            if (input.includes("バイト") || input.includes("時給") || input.includes("シフト")) {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  const payMatch = input.match(/時給\s*(\d+)/) || [null, 1100];
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        const timeMatch = input.match(/(\d+)〜(\d+)時/) || input.match(/(\d+)時から(\d+)時/);
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              let hours = timeMatch ? (parseInt(timeMatch[2]) - parseInt(timeMatch[1])) : 5;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    let pay = hours * parseInt(payMatch[1]);
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          hiddenStats.shiftEarned += pay;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                naviSay(`シフト登録完了！${hours}時間で +￥${pay.toLocaleString()} の想定だよ！`);
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      sysLog(`[Shift] 登録: ${hours}h (+￥${pay})`);
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            return;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                }

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    // 2. 金銭管理判別
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        if (input.includes("円")) {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              const moneyMatch = input.match(/(\d+)円/);
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    if (moneyMatch) {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            hiddenStats.expenseCount += 1;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    naviSay(`支出￥${parseInt(moneyMatch[1]).toLocaleString()}を記録したよ！計画的にね！`);
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            sysLog(`[Finance] 支出記録: ￥${moneyMatch[1]}`);
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    return;
