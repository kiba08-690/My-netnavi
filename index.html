<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
      <title>PET Terminal - Personal Executive Terminal</title>
        <style>
            :root {
                  --bg-color: #0b0f19;
                        --card-bg: rgba(16, 26, 46, 0.85);
                              --primary: #00f0ff;
                                    --secondary: #ff007f;
                                          --accent: #ffe600;
                                                --text: #e0f7fc;
                                                      --text-dim: #7090b0;
                                                            --border: rgba(0, 240, 255, 0.3);
                                                                }

                                                                    * {
                                                                          box-sizing: border-box;
                                                                                margin: 0;
                                                                                      padding: 0;
                                                                                            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
                                                                                                }

                                                                                                    body {
                                                                                                          background-color: var(--bg-color);
                                                                                                                color: var(--text);
                                                                                                                      display: flex;
                                                                                                                            justify-content: center;
                                                                                                                                  align-items: center;
                                                                                                                                        min-height: 100vh;
                                                                                                                                              padding: 12px;
                                                                                                                                                  }

                                                                                                                                                      .container {
                                                                                                                                                            width: 100%;
                                                                                                                                                                  max-width: 440px;
                                                                                                                                                                        background: var(--card-bg);
                                                                                                                                                                              border: 1px solid var(--border);
                                                                                                                                                                                    border-radius: 16px;
                                                                                                                                                                                          padding: 16px;
                                                                                                                                                                                                box-shadow: 0 0 20px rgba(0, 240, 255, 0.15);
                                                                                                                                                                                                      backdrop-filter: blur(8px);
                                                                                                                                                                                                          }

                                                                                                                                                                                                              header {
                                                                                                                                                                                                                    display: flex;
                                                                                                                                                                                                                          justify-content: space-between;
                                                                                                                                                                                                                                align-items: center;
                                                                                                                                                                                                                                      border-bottom: 1px solid var(--border);
                                                                                                                                                                                                                                            padding-bottom: 10px;
                                                                                                                                                                                                                                                  margin-bottom: 14px;
                                                                                                                                                                                                                                                      }

                                                                                                                                                                                                                                                          .title {
                                                                                                                                                                                                                                                                font-size: 1.1rem;
                                                                                                                                                                                                                                                                      font-weight: bold;
                                                                                                                                                                                                                                                                            color: var(--primary);
                                                                                                                                                                                                                                                                                  letter-spacing: 1px;
                                                                                                                                                                                                                                                                                      }

                                                                                                                                                                                                                                                                                          .status-badge {
                                                                                                                                                                                                                                                                                                font-size: 0.75rem;
                                                                                                                                                                                                                                                                                                      background: rgba(0, 240, 255, 0.15);
                                                                                                                                                                                                                                                                                                            color: var(--primary);
                                                                                                                                                                                                                                                                                                                  padding: 4px 8px;
                                                                                                                                                                                                                                                                                                                        border-radius: 12px;
                                                                                                                                                                                                                                                                                                                              border: 1px solid var(--primary);
                                                                                                                                                                                                                                                                                                                                  }

                                                                                                                                                                                                                                                                                                                                      /* ナビ表示エリア */
                                                                                                                                                                                                                                                                                                                                          .navi-avatar {
                                                                                                                                                                                                                                                                                                                                                background: rgba(0, 0, 0, 0.4);
                                                                                                                                                                                                                                                                                                                                                      border: 1px dashed var(--border);
                                                                                                                                                                                                                                                                                                                                                            border-radius: 12px;
                                                                                                                                                                                                                                                                                                                                                                  padding: 12px;
                                                                                                                                                                                                                                                                                                                                                                        display: flex;
                                                                                                                                                                                                                                                                                                                                                                              align-items: center;
                                                                                                                                                                                                                                                                                                                                                                                    gap: 12px;
                                                                                                                                                                                                                                                                                                                                                                                          margin-bottom: 14px;
                                                                                                                                                                                                                                                                                                                                                                                              }

                                                                                                                                                                                                                                                                                                                                                                                                  .navi-icon {
                                                                                                                                                                                                                                                                                                                                                                                                        width: 48px;
                                                                                                                                                                                                                                                                                                                                                                                                              height: 48px;
                                                                                                                                                                                                                                                                                                                                                                                                                    border-radius: 50%;
                                                                                                                                                                                                                                                                                                                                                                                                                          background: radial-gradient(circle, var(--primary) 0%, rgba(0,0,0,0.8) 100%);
                                                                                                                                                                                                                                                                                                                                                                                                                                display: flex;
                                                                                                                                                                                                                                                                                                                                                                                                                                      justify-content: center;
                                                                                                                                                                                                                                                                                                                                                                                                                                            align-items: center;
                                                                                                                                                                                                                                                                                                                                                                                                                                                  font-size: 1.4rem;
                                                                                                                                                                                                                                                                                                                                                                                                                                                        box-shadow: 0 0 10px var(--primary);
                                                                                                                                                                                                                                                                                                                                                                                                                                                            }

                                                                                                                                                                                                                                                                                                                                                                                                                                                                .navi-dialog {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                      flex: 1;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                            font-size: 0.85rem;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  line-height: 1.4;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        color: var(--text);
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            }

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                /* タブ切替 */
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    .tab-menu {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          display: flex;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                gap: 8px;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      margin-bottom: 14px;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          }

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              .tab-btn {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    flex: 1;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          background: rgba(0, 240, 255, 0.05);
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                border: 1px solid var(--border);
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      color: var(--text-dim);
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            padding: 8px 0;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  border-radius: 8px;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        font-size: 0.8rem;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              cursor: pointer;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    text-align: center;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        }

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            .tab-btn.active {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  background: var(--primary);
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        color: #000;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              font-weight: bold;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    border-color: var(--primary);
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        }

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            .tab-content {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  display: none;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      }

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          .tab-content.active {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                display: block;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    }

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        /* 入力フォーム */
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            .input-group {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  display: flex;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        gap: 8px;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              margin-bottom: 14px;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  }

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      input[type="text"] {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            flex: 1;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  background: rgba(0, 0, 0, 0.5);
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        border: 1px solid var(--border);
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              border-radius: 8px;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    padding: 10px;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          color: var(--text);
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                font-size: 0.9rem;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      outline: none;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          }

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              input[type="text"]:focus {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    border-color: var(--primary);
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          box-shadow: 0 0 8px rgba(0, 240, 255, 0.4);
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              }

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  button.add-btn {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        background: var(--primary);
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              color: #000;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    border: none;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          padding: 0 16px;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                border-radius: 8px;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      font-weight: bold;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            cursor: pointer;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                }

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    /* 給与計算設定 */
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        .calc-box {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              background: rgba(0, 0, 0, 0.3);
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    border: 1px solid var(--border);
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          border-radius: 8px;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                padding: 12px;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      margin-bottom: 14px;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            font-size: 0.8rem;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                }

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    .calc-row {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          display: flex;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                justify-content: space-between;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      align-items: center;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            margin-bottom: 8px;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                }

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    .calc-row:last-child {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          margin-bottom: 0;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              }

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  .calc-row label {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        color: var(--text-dim);
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            }

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                .calc-row input[type="number"], .calc-row select {
